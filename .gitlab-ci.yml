# GitLab CI equivalent of .github/workflows/pages.yml: builds the website and
# publishes it with GitLab Pages on every push to the default branch.

pages:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - uv run scripts/build_site.py
    - mv site public
  artifacts:
    paths:
      - public
