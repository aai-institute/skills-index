<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Index</title>
<meta name="description" content="Browse and install agent skills.">
<meta name="theme-color" content="#172736">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  /* Brand palette */
  @theme {
    /* primary */
    --color-brand-navy: #172736;      /* dark-blue-bg */
    --color-brand-blue: #084059;      /* dark-blue */
    --color-brand-grey: #ced8de;
    --color-brand-lightgrey: #eaeef1;
    --color-brand-teal: #18a5a7;      /* dark-green */
    --color-brand-green: #bfffc7;     /* electric-green */
    --color-brand-indigo: #704dff;    /* electric-indigo */
    /* secondary */
    --color-brand-skyblue: #3f89e4;
    --color-brand-bloom: #46add5;
    --color-brand-lilac: #bd86f8;
    --color-brand-yellow: #ffc819;
    --color-brand-orange: #ef9336;
    --color-brand-red: #fd5e42;

    --font-sans: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
    --font-display: "Sora", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --animate-blink: blink 1.1s step-end infinite;
    @keyframes blink { 50% { opacity: 0; } }
  }
  @layer base {
    html { color-scheme: light dark; }
    a, button, input, select {
      @apply focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-indigo dark:focus-visible:outline-brand-green;
    }
  }
</style>
</head>
<body class="bg-brand-lightgrey text-brand-navy dark:bg-brand-navy dark:text-brand-lightgrey font-sans leading-relaxed antialiased">

<header class="relative overflow-hidden border-b border-white/10 bg-brand-navy text-brand-lightgrey">
  <!-- Ring motif taken from the interlocking circles of the appliedAI mark. -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0">
    <div class="absolute -top-28 right-[-7rem] size-[26rem] rounded-full border-[2.75rem] border-brand-teal/15"></div>
    <div class="absolute -bottom-40 right-[10rem] size-[19rem] rounded-full border-[2.25rem] border-brand-green/10"></div>
  </div>

  <div class="relative mx-auto max-w-5xl px-5 pt-8 pb-12">
    <div class="flex flex-wrap items-center justify-between gap-x-8 gap-y-4">
      <p class="font-mono text-xs tracking-[0.22em] uppercase text-brand-teal">Agent skills registry</p>
      <a href="https://www.appliedai-institute.de/" class="shrink-0">
        <img src="./assets/aai_logo_white.png" alt="appliedAI Institute for Europe" class="h-9 w-auto">
      </a>
    </div>

    <h1 class="mt-6 font-display text-4xl font-bold tracking-tight sm:text-5xl">Skill Index</h1>

    <section class="mt-9 rounded-xl border border-white/10 bg-white/5 p-5" aria-label="Getting started">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <h2 class="font-mono text-xs font-semibold tracking-[0.18em] uppercase text-brand-teal">Getting started</h2>
        <div class="flex flex-wrap items-center gap-2.5">
          <label for="target" class="text-xs text-brand-grey">Install to</label>
          <select id="target"
            class="rounded-md border border-white/15 bg-white/10 px-2 py-1 font-mono text-xs text-brand-lightgrey [color-scheme:dark]"></select>
        </div>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1.5">
        <span class="w-44 shrink-0 text-sm text-brand-grey">Install apm</span>
        <span class="inline-flex max-w-full items-center gap-2.5 rounded-lg border border-white/10 bg-brand-navy py-1.5 pr-1.5 pl-3.5"><code
          class="overflow-x-auto font-mono text-[0.85rem] whitespace-pre text-brand-green [scrollbar-width:none]">curl -sSL https://aka.ms/apm-unix | sh</code><button data-copy>Copy</button></span>
      </div>
      <p class="mt-4 text-sm text-brand-grey">Then install skills from the list below.</p>
    </section>
  </div>
</header>

<main class="mx-auto max-w-5xl px-5 pb-20">
  <div class="mt-10 mb-5 flex flex-wrap items-center gap-x-4 gap-y-3">
    <h2 class="font-display text-2xl font-bold tracking-tight">Skills</h2>
    <span id="count" aria-live="polite"
      class="rounded-full border border-brand-grey bg-white px-2.5 py-0.5 text-xs font-medium text-brand-blue dark:border-brand-grey/20 dark:bg-brand-blue/45 dark:text-brand-grey"></span>
    <div class="relative ml-auto w-full sm:w-[28rem]">
      <input id="search" type="search" placeholder="Search skills" aria-label="Search skills"
        class="peer w-full rounded-lg border border-brand-grey bg-white px-4 py-2.5 pr-10 text-base dark:border-brand-grey/20 dark:bg-brand-blue/45">
      <kbd class="pointer-events-none absolute top-1/2 right-2.5 hidden -translate-y-1/2 rounded border border-brand-grey px-1.5 font-mono text-[0.7rem] text-brand-blue/70 sm:peer-placeholder-shown:block dark:border-brand-grey/25 dark:text-brand-grey/70">/</kbd>
    </div>
  </div>

  <ul id="skills" class="grid list-none items-start gap-4"></ul>
  <p id="empty" hidden class="rounded-xl border border-dashed border-brand-grey p-10 text-center text-brand-blue dark:border-brand-grey/25 dark:text-brand-grey">No skills match your search.</p>

  <footer class="mt-16 border-t border-brand-navy/10 pt-6 text-sm text-brand-blue dark:border-brand-grey/15 dark:text-brand-grey">
    <p>To add a skill, open a pull request with a new directory under
    <code id="skills-dir" class="font-mono">skills/</code>, to
    <a id="repo-link" class="font-medium text-brand-indigo hover:underline dark:text-brand-green" href="#">this repo</a>.</p>
  </footer>
</main>

<script>
  /* Structure of this script:
       1. Helpers        -- HTML escaping, shared Tailwind class lists
       2. Copy buttons   -- the Copy/Copied chips next to every command
       3. Target picker  -- the "Install to" select and --target rewriting
       4. Rendering      -- header fields and the skill card list
       5. Search         -- fuzzy/substring filtering and title highlighting
       6. init()         -- fetches skills.json and wires everything up   */

  // --- 1. Helpers ---

  const esc = (s) => s.replace(/[&<>"'\n]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "\n": "&#10;" }[c]));

  // Shared Tailwind class lists for elements created or restyled from JS.
  // Command chips render as the same navy terminal line everywhere on the page.
  const CMD_BOX = "inline-flex max-w-full items-center justify-between gap-2.5 rounded-lg border border-white/10 bg-brand-navy py-1.5 pr-1.5 pl-3.5 dark:border-brand-grey/15 dark:bg-brand-navy/70";
  const CMD_CODE = "overflow-x-auto font-mono text-[0.85rem] leading-relaxed whitespace-pre text-brand-green [scrollbar-width:none]";
  const COPY_IDLE = ["border-white/15", "bg-white/5", "text-brand-grey", "hover:border-white/30", "hover:text-white"];
  const COPY_DONE = ["border-brand-green/60", "bg-brand-green/10", "text-brand-green"];
  const MARK = "rounded-[3px] bg-brand-green/70 text-brand-navy dark:bg-brand-green/25 dark:text-brand-green";

  // --- 2. Copy buttons ---

  function wireCopy(button) {
    button.className = "flex-none cursor-pointer rounded-md border px-2 py-1 text-xs font-medium transition-colors";
    button.classList.add(...COPY_IDLE);
    button.addEventListener("click", async () => {
      const code = button.parentElement.querySelector("code");
      await navigator.clipboard.writeText(code.textContent);
      button.textContent = "Copied";
      button.classList.remove(...COPY_IDLE);
      button.classList.add(...COPY_DONE);
      setTimeout(() => {
        button.textContent = "Copy";
        button.classList.remove(...COPY_DONE);
        button.classList.add(...COPY_IDLE);
      }, 1500);
    });
  }

  // --- 3. Target picker ---

  // Target agents for apm --target <value>.
  const TARGETS = [
    { value: "claude", label: "Claude Code" },
    { value: "copilot", label: "GitHub Copilot" },
    { value: "cursor", label: "Cursor" },
    { value: "codex", label: "Codex" },
    { value: "gemini", label: "Gemini CLI" },
    { value: "opencode", label: "OpenCode" },
    { value: "kiro", label: "Kiro" },
    { value: "antigravity", label: "Antigravity" },
  ];

  const state = { target: "claude" };

  // Rewrites every command on the page for the selected target.
  function applyCommands() {
    for (const code of document.querySelectorAll("code[data-apm]")) {
      let command = code.dataset.apm;
      if (state.target) command += ` --target ${state.target}`;
      code.textContent = command;
    }
    try { localStorage.setItem("target", state.target); } catch {}
  }

  function setupTargetPicker() {
    const select = document.getElementById("target");
    select.innerHTML = TARGETS.map((t) => `<option value="${t.value}">${t.label}</option>`).join("");
    try {
      const saved = localStorage.getItem("target") || "";
      if (TARGETS.some((t) => t.value === saved)) state.target = saved;
    } catch {}
    select.value = state.target;
    applyCommands();
    select.addEventListener("change", () => { state.target = select.value; applyCommands(); });
  }

  // --- 4. Rendering ---

  function renderHeader({ repoUrl }) {
    document.getElementById("repo-link").href = repoUrl;
  }

  function skillCard(s) {
    return `
      <li class="flex min-w-0 flex-col rounded-xl border border-brand-grey bg-white p-5 transition-colors hover:border-brand-teal/60 dark:border-brand-grey/20 dark:bg-brand-blue/45 dark:hover:border-brand-teal/50"
          data-name="${esc(s.name)}" data-text="${esc((s.name + " " + s.description).toLowerCase())}">
        <div class="flex flex-wrap items-baseline gap-3">
          <h3 class="font-mono text-[1.02rem] font-semibold tracking-tight">${esc(s.name)}</h3>
          <a class="ml-auto text-xs font-medium text-brand-indigo hover:underline dark:text-brand-green" href="${esc(s.source)}">Source</a>
        </div>
        <p class="mt-1 font-mono text-xs text-brand-blue/70 dark:text-brand-grey/70">${esc(s.path)}</p>
        <div class="mt-2 mb-4 flex-1">
          <p data-desc class="line-clamp-3 max-w-[75ch] text-[0.92rem] text-brand-blue dark:text-brand-grey">${esc(s.description)}</p>
          <button data-expand hidden class="mt-1 cursor-pointer text-xs font-medium text-brand-indigo hover:underline dark:text-brand-green">Show more</button>
        </div>
        <span class="${CMD_BOX} "><code class="${CMD_CODE}" data-apm="${esc(s.install)}"></code><button data-copy>Copy</button></span>
      </li>`;
  }

  function renderSkillCards(skills) {
    document.getElementById("skills").innerHTML = skills.map(skillCard).join("");
  }

  // Shows the "Show more" toggle only on cards whose description overflows
  // the three-line clamp. Overflow cannot be measured once up front: the
  // Tailwind browser build applies the clamp asynchronously and web fonts
  // change line metrics when they load, so re-check on every size change.
  function wireExpand(card) {
    const desc = card.querySelector("[data-desc]");
    const button = card.querySelector("[data-expand]");
    button.addEventListener("click", () => {
      const clamped = desc.classList.toggle("line-clamp-3");
      button.textContent = clamped ? "Show more" : "Show less";
    });
    new ResizeObserver(() => {
      if (desc.classList.contains("line-clamp-3"))
        button.hidden = desc.scrollHeight <= desc.clientHeight;
    }).observe(desc);
  }

  // --- 5. Search ---

  // Fuzzy search via Fuse.js from a CDN; if it cannot load (offline,
  // blocked CDN), returns null and search falls back to substring filtering.
  async function loadFuse(skills) {
    try {
      const { default: Fuse } = await import("https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.mjs");
      return new Fuse(skills, {
        keys: [
          { name: "name", weight: 2 },
          { name: "description", weight: 1 },
        ],
        threshold: 0.35,
        ignoreLocation: true,
        includeMatches: true,
      });
    } catch {
      return null;
    }
  }

  // Returns { matched, marks }: the matching card elements in relevance
  // order, plus a per-card list of title character ranges to highlight.
  function matchSkills(q, fuse, items, itemByName) {
    const marks = new Map();
    if (!q) return { matched: items, marks };
    if (fuse) {
      const matched = [];
      for (const result of fuse.search(q)) {
        const item = itemByName.get(result.item.name);
        matched.push(item);
        const nameMatch = (result.matches || []).find((m) => m.key === "name");
        // Fuzzy matching also reports stray single-character runs; only
        // highlight runs long enough to be recognizable as the query.
        const minLen = Math.min(2, q.length);
        if (nameMatch) marks.set(item, nameMatch.indices.filter(([s, e]) => e - s + 1 >= minLen));
      }
      return { matched, marks };
    }
    const matched = items.filter((item) => item.dataset.text.includes(q.toLowerCase()));
    for (const item of matched) {
      const i = item.dataset.name.toLowerCase().indexOf(q.toLowerCase());
      if (i >= 0) marks.set(item, [[i, i + q.length - 1]]);
    }
    return { matched, marks };
  }

  // Rewrites a card's title, wrapping the matched character ranges in <mark>.
  function setCardTitle(item, ranges) {
    const h3 = item.querySelector("h3");
    const name = item.dataset.name;
    if (!ranges || !ranges.length) {
      h3.textContent = name;
      return;
    }
    let html = "";
    let last = 0;
    for (const [start, end] of ranges) {
      html += esc(name.slice(last, start)) + `<mark class="${MARK}">${esc(name.slice(start, end + 1))}</mark>`;
      last = end + 1;
    }
    h3.innerHTML = html + esc(name.slice(last));
  }

  function setupSearch(fuse) {
    const list = document.getElementById("skills");
    const count = document.getElementById("count");
    const empty = document.getElementById("empty");
    const items = [...list.children];
    const itemByName = new Map(items.map((item) => [item.dataset.name, item]));

    const update = (q) => {
      const { matched, marks } = matchSkills(q, fuse, items, itemByName);
      const visible = new Set(matched);
      for (const item of items) {
        item.hidden = !visible.has(item);
        setCardTitle(item, marks.get(item));
      }
      list.append(...matched); // best match first; original order when unfiltered
      count.textContent = q ? `${matched.length} of ${items.length}` : `${items.length}`;
      empty.hidden = matched.length > 0;
    };
    update("");

    const search = document.getElementById("search");
    search.addEventListener("input", (e) => update(e.target.value.trim()));
    document.addEventListener("keydown", (e) => {
      const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || "");
      if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        search.focus();
      }
    });
  }

  // --- 6. init ---

  async function init() {
    const data = await fetch("./skills.json").then((r) => r.json());
    renderHeader(data);
    renderSkillCards(data.skills);
    document.querySelectorAll("button[data-copy]").forEach(wireCopy);
    document.querySelectorAll("#skills > li").forEach(wireExpand);
    setupTargetPicker();
    setupSearch(await loadFuse(data.skills));
  }

  init();
</script>
</body>
</html>
